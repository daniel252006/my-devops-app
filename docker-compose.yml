# docker-compose.yml
version: '3.8'

services:
  # 1. The Blue Environment
  app-blue:
    build: .
    container_name: devops-blue
    environment:
      - APP_VERSION=1.0 (Blue)
      - APP_COLOR=#0074D9
    expose:
      - "5000"

  # 2. The Green Environment
  app-green:
    build: .
    container_name: devops-green
    environment:
      - APP_VERSION=2.0 (Green)
      - APP_COLOR=#2ECC40
    expose:
      - "5000"

  # 3. The Nginx Traffic Cop
  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    ports:
      - "80:80" # Map localhost:80 to Nginx's internal port 80
    volumes:
      # Mount our custom config file into the Nginx container
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-blue
      - app-green